<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565c0" />
      <stop offset="100%" stop-color="#0d1b2a" />
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb74d" />
      <stop offset="50%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#f57c00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ff9800" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Shield Rounded Rect -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bgGrad)" stroke="url(#copperGrad)" stroke-width="2.5" filter="url(#glow)" />

  <!-- Shield Emblem Path -->
  <path d="M32 14 L46 20 C46 34 38 44 32 49 C26 44 18 34 18 20 Z" fill="none" stroke="url(#copperGrad)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Central D20 / Tabletop Star / Dice Dot -->
  <polygon points="32,22 41,27 41,37 32,42 23,37 23,27" fill="rgba(255,152,0,0.25)" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="32" cy="32" r="3" fill="url(#copperGrad)" />
  <line x1="32" y1="22" x2="32" y2="42" stroke="#ffffff" stroke-width="1" opacity="0.6" />
  <line x1="23" y1="27" x2="41" y2="37" stroke="#ffffff" stroke-width="1" opacity="0.6" />
  <line x1="23" y1="37" x2="41" y2="27" stroke="#ffffff" stroke-width="1" opacity="0.6" />
</svg>
